<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход - ОМА</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f5f5f5; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .button { display: block; width: 200px; margin: 10px auto; padding: 1rem; border-radius: 8px; border: none; cursor: pointer; text-decoration: none; color: white; font-weight: bold; }
        .btn-client { background: #6a1b9a; }
        .btn-master { background: #46aa42; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Выберите роль</h1>
        <a href="client.html" class="button btn-client" onclick="localStorage.setItem('oma:role', 'client')">Я Клиент</a>
        <a href="master.html" class="button btn-master" onclick="localStorage.setItem('oma:role', 'master')">Я Мастер</a>
    </div>
</body>
</html>
